name: Cleanup Confuse prewarm staging

on:
  push:
    branches:
      - chatgpt/confuse-prewarm-2026-08-21
    paths:
      - scripts/cleanup-confuse-prewarm.sh

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out performance branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/confuse-prewarm-2026-08-21

      - name: Remove staging-only files
        run: bash scripts/cleanup-confuse-prewarm.sh

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove Confuse prewarm staging workflow"
          git push origin HEAD:chatgpt/confuse-prewarm-2026-08-21
