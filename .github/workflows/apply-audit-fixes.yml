name: Apply audited source fix

on:
  push:
    branches:
      - chatgpt/audit-2026-08-21
    paths:
      - scripts/apply-audit-fixes.mjs
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/audit-2026-08-21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact audited patch
        run: node scripts/apply-audit-fixes.mjs

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: correct text section aria target"
          git push origin HEAD:chatgpt/audit-2026-08-21
