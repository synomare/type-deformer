name: Apply reliability fixes

on:
  push:
    branches:
      - chatgpt/reliability-fixes-2026-08-21
    paths:
      - scripts/apply-reliability-fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reliability branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/reliability-fixes-2026-08-21

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Apply exact source patch
        run: python3 scripts/apply-reliability-fixes.py

      - name: Pin browser test dependency
        run: npm install --save-dev --save-exact @playwright/test

      - name: Run structural validation
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Commit tested reliability changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html package.json package-lock.json .github/workflows/validate.yml
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "fix: harden video export and autosave reliability"
          git push origin HEAD:chatgpt/reliability-fixes-2026-08-21
