name: Finalize Text Animator foundation

on:
  push:
    branches:
      - chatgpt/text-animator-foundation-2026-08-21
    paths:
      - .github/workflows/finalize-text-animator.yml

permissions:
  contents: write

concurrency:
  group: finalize-text-animator-foundation
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/text-animator-foundation-2026-08-21
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply Text Animator integration
        run: |
          node scripts/apply-text-animator.mjs
          node scripts/fix-text-animator-clock.mjs
          node scripts/fix-text-animator-clock-v2.mjs

      - name: Generate lockfile and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Run structural and unit validation
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered browser tests
        run: npm run test:e2e

      - name: Check patch hygiene
        run: git diff --check

      - name: Remove one-shot integration machinery
        run: |
          rm -f scripts/apply-text-animator.mjs
          rm -f scripts/fix-text-animator-clock.mjs
          rm -f scripts/fix-text-animator-clock-v2.mjs
          rm -f scripts/debug-text-animator*.mjs
          rm -f .github/workflows/apply-text-animator.yml
          rm -f .github/workflows/finalize-text-animator.yml
          rm -f .text-animator-trigger .text-animator-trigger-*

      - name: Commit tested source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add deterministic Text Animator foundation"
          git push origin HEAD:chatgpt/text-animator-foundation-2026-08-21
