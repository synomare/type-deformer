name: Apply keyframe timeline

on:
  push:
    branches:
      - chatgpt/keyframe-timeline-2026-08-22
    paths:
      - .github/workflows/apply-keyframe-timeline.yml
      - .keyframe-timeline-trigger
      - scripts/apply-keyframe-timeline.mjs
      - scripts/run-keyframe-timeline.mjs
      - text-animator-timeline.js
      - text-animator-timeline-ui.js
      - tests/text-animator-timeline.unit.mjs
      - tests/text-animator-timeline.smoke.spec.mjs
      - package.json
  pull_request:
    paths:
      - .keyframe-timeline-trigger
      - scripts/run-keyframe-timeline.mjs
      - text-animator-timeline.js
      - text-animator-timeline-ui.js
      - tests/text-animator-timeline.unit.mjs
      - tests/text-animator-timeline.smoke.spec.mjs
      - package.json

permissions:
  contents: write

concurrency:
  group: keyframe-timeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/keyframe-timeline-2026-08-22
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply timeline integration
        run: node scripts/run-keyframe-timeline.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate source and unit behavior
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered browser tests
        run: npm run test:e2e

      - name: Remove temporary files and generated artifacts
        run: |
          rm -rf node_modules playwright-report test-results
          rm -f scripts/apply-keyframe-timeline.mjs scripts/run-keyframe-timeline.mjs .github/workflows/apply-keyframe-timeline.yml .keyframe-timeline-trigger

      - name: Commit tested result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add keyframe timeline and property tracks"
          git push origin HEAD:chatgpt/keyframe-timeline-2026-08-22
