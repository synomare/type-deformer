name: Apply runtime reliability patch v2

on:
  push:
    branches:
      - chatgpt/runtime-reliability-2026-08-21

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reliability branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/runtime-reliability-2026-08-21

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify, apply, and validate exact patch
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            8ea0c56a67f74f29417032e5cad7304ebe03af05
            66497a0acb8aa48c9a33a38450b6d37b3287aa55
            f87467195149d285d29055ccf27cb15f3300e097
            a2d904a1fe64bb17f361621e086749bcd518913b
            bd6a7e6f58bc8ab8a50e734fb82dc5002bfc7330
            f5112b3a6531349464e5169afda6b9a1782e44b7
            efc2f1e25188a34d253585f0f006dffeadefef13
            3c20ec182d7f7854768c92f98629165fbd5a1e25
            0ef57f9e04c7aaaadc80b89bf324da990dbe89b9
            1bafd89eabb8a5646622b5a5b06417dd27c0b6c4
          )
          for index in {00..09}; do
            file=".github/runtime-reliability-payload/${index}.part"
            actual="$(git hash-object "$file")"
            test "$actual" = "${expected[$((10#$index))]}"
          done
          cat .github/runtime-reliability-payload/*.part > /tmp/runtime-reliability.b64
          base64 --decode /tmp/runtime-reliability.b64 | gzip --decompress > /tmp/apply-runtime-reliability.mjs
          echo "1b93177bdae78a839e5363b731d8cdb768c7db6b6276e741ec9811b03990a840  /tmp/apply-runtime-reliability.mjs" | sha256sum --check --strict
          node --check /tmp/apply-runtime-reliability.mjs
          node /tmp/apply-runtime-reliability.mjs
          npm test

      - name: Commit patched source and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/runtime-reliability-payload
          rm -f .github/runtime-reliability-trigger
          rm -f .github/workflows/apply-runtime-reliability.yml
          rm -f .github/workflows/apply-runtime-reliability-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden autosave and video timing"
          git push origin HEAD:chatgpt/runtime-reliability-2026-08-21
