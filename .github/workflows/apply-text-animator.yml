name: Apply Text Animator foundation

on:
  push:
    branches:
      - chatgpt/text-animator-foundation-2026-08-21
    paths:
      - .github/workflows/apply-text-animator.yml
      - .text-animator-trigger
      - scripts/fix-text-animator-clock.mjs
      - tests/text-animator.smoke.spec.mjs
      - tests/text-animator.unit.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-text-animator.yml
      - .text-animator-trigger
      - scripts/apply-text-animator.mjs
      - scripts/fix-text-animator-clock.mjs
      - text-animator.js
      - tests/text-animator.smoke.spec.mjs
      - tests/text-animator.unit.mjs
      - playwright.config.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/text-animator-foundation-2026-08-21
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply integration patch
        run: |
          node scripts/apply-text-animator.mjs
          node scripts/fix-text-animator-clock.mjs

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Validate source and unit behavior
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered browser smoke tests
        run: npm run test:e2e

      - name: Remove one-shot patch machinery
        run: rm -f scripts/apply-text-animator.mjs scripts/fix-text-animator-clock.mjs .github/workflows/apply-text-animator.yml .text-animator-trigger

      - name: Commit tested result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Text Animator stack and motion engine"
          git push origin HEAD:chatgpt/text-animator-foundation-2026-08-21
